[Main]
SettingsVersion = 3
StartFullscreen = true
EmulationSpeed = 1.0
FastForwardSpeed = 0.0
TurboSpeed = 0.0
RewindEnable = false
RunaheadFrameCount = 0

[CPU]
ExecutionMode = Recompiler
FastmemMode = MMap
RecompilerBlockLinking = true
RecompilerICache = false
RecompilerMemoryExceptions = false
OverclockEnable = false

[GPU]
Renderer = OpenGL
UseThread = true
MaxQueuedFrames = 2
ResolutionScale = 1
Multisamples = 1
TextureFilter = Nearest
SpriteTextureFilter = Nearest
DitheringMode = TrueColor
LineDetectMode = Disabled
DownsampleMode = Disabled
PerSampleShading = false
PGXPEnable = false
PGXPCPU = false
DisableShaderCache = false

[BIOS]
SearchDirectory = /storage/roms/bios
PathNTSCU = 
PathNTSCJ = 
PathPAL = 
PatchTTYEnable = false
PatchFastBoot = true
FastForwardBoot = true

[CDROM]
ReadaheadSectors = 8

[Controller1]
Type = AnalogController
ButtonUp = Controller0/Button11
ButtonDown = Controller0/Button12
ButtonLeft = Controller0/Button13
ButtonRight = Controller0/Button14
ButtonSelect = Controller0/Button4
ButtonStart = Controller0/Button6
ButtonTriangle = Controller0/Button2
ButtonCross = Controller0/Button1
ButtonSquare = Controller0/Button3
ButtonCircle = Controller0/Button0
ButtonL1 = Controller0/Button9
ButtonL2 = Controller0/+Axis4
ButtonR1 = Controller0/Button10
ButtonR2 = Controller0/+Axis5
ButtonL3 = Controller0/Button7
ButtonR3 = Controller0/Button8
AxisLeftX = Controller0/Axis0
AxisLeftY = Controller0/Axis1
AxisRightX = Controller0/Axis2
AxisRightY = Controller0/Axis3
ButtonAnalog = Controller0/Button5

[Hotkeys]
OpenQuickMenu = Keyboard/Escape
PowerOff = Controller0/Button4+Controller0/Button6
FastForward = Keyboard/Tab
TogglePause = Keyboard/Space
ToggleFullscreen = Keyboard/Alt+Return
Screenshot = Keyboard/F10

[Logging]
LogLevel = Error
LogFilter = 
LogToConsole = false
LogToDebug = false
LogToWindow = false
LogToFile = false

[Display]
ShowFPS = true
ShowVPS = true
ShowSpeed = true
VSync = false
OptimalFramePacing = false
SkipPresentingDuplicateFrames = false

[Audio]
Backend = SDL
